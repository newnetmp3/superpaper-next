name: CI

# Runs the same lint/format/type gate that pre-commit enforces locally, so PRs
# are checked automatically. Type checking (ty) runs here too: the wx/dbus
# imports it cannot resolve without the GUI/Linux extras are suppressed with
# inline `# ty:ignore[unresolved-import]` directives, so ty and the headless
# unit tests pass against the `dev` group sync alone. GUI integration remains a
# separate platform-testing concern.

on:
  push:
    branches: [master, "ci/**", "fix/**"]
  pull_request:
  workflow_dispatch:

# Least-privilege: the lint job only needs to read the repo.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint, format & type-check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # setup-uv v8 dropped major/minor tags for supply-chain safety, so the
      # full version must be pinned. Latest as of 2026-07-01.
      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          python-version: "3.14"

      # Syncs the project plus the `dev` dependency group (ruff, ty, pytest,
      # pre-commit)
      # from uv.lock. Only the core runtime deps (all wheels) come along; the
      # gui/linux extras that need system build deps are not installed.
      - name: Install dev tooling
        run: uv sync --frozen --group dev

      - name: Ruff lint
        run: uv run ruff check --output-format=github

      - name: Ruff format check
        run: uv run ruff format --diff superpaper/gui.py superpaper/local_shaders.py superpaper/wallpaper_processing.py tests/test_local_shaders.py

      - name: Type check (ty)
        run: uv run ty check

      - name: Run headless functionality tests
        run: uv run pytest -q --durations=10

  package:
    name: Build and check distributable
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv and Python 3.14
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Build wheel
        run: uv build --wheel --out-dir dist

      - name: Verify package resources from installed wheel
        run: |
          uv run --no-project --python 3.14 --with ./dist/*.whl python -c '
          from importlib.resources import files
          package = files("superpaper")
          for name in ("resources/superpaper.png", "resources/superpaper.svg"):
              assert package.joinpath(name).is_file(), f"Missing packaged asset: {name}"
          print("Package assets present")
          '

      - name: Smoke-test installed command-line entry point
        run: uv run --no-project --python 3.14 --with ./dist/*.whl python -m superpaper --help
